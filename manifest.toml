#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gaming_system"
name = "Brain Games"
description.en = "Lightweight brain games platform (Wordle, Connections, Sudoku…) with an admin panel for daily puzzles"
description.fr = "Plateforme légère de jeux cérébraux (Wordle, Connections, Sudoku…) avec un panneau d'admin pour les puzzles du jour"

version = "1.0~ynh1"

maintainers = []

[upstream]
license = "MIT"

[integration]
yunohost = ">= 11.3"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "5M"
ram.build = "5M"
ram.runtime = "25M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/games"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    help.en = "Password for the admin panel at <your-url>/admin.html (not saved in YunoHost settings)"
    type = "password"

[resources]
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8095

    [resources.apt]
    packages = "python3"
